# Dependabot configuration for mimir-agent-kit
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. GitHub Actions Workflows & SHA-Pinned Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # 2. Python Package Manifests & Lockfile (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        patterns:
          - "actionlint*"
          - "mypy*"
          - "pre-commit*"
          - "pytest*"
          - "pyyaml*"
          - "ruff*"
          - "rumdl*"
          - "types-pyyaml*"
          - "zizmor*"
      dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
