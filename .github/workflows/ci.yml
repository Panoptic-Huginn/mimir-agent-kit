name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Check lockfile freshness
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint and security-audit GitHub Actions workflows
        run: |
          uv run actionlint
          uv run zizmor --strict-collection --min-severity=low .github/workflows/

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      - name: Run pre-commit hooks via prek
        env:
          SKIP: no-commit-to-branch
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Audit dependency hygiene (deptry)
        run: uv run deptry .

      - name: Scan dependencies for CVEs (pip-audit)
        run: uv run pip-audit

      - name: Run pytest suite
        run: uv run pytest -v

  python-315-matrix:
    name: Python 3.15 Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.15'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies on Python 3.15
        run: uv sync --locked --python 3.15 --all-extras --dev

      - name: Verify Ruff, Basedpyright, ty, and pytest on Python 3.15
        run: |
          uv run --python 3.15 ruff check .
          uv run --python 3.15 basedpyright
          uv run --python 3.15 ty check
          uv run --python 3.15 pytest -v
