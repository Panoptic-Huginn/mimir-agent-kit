# Clippy Linter Configuration
# Enforces Google Rust Styleguide, cognitive complexity limits, and zero-panic constraints.

cognitive-complexity-threshold = 25
type-complexity-threshold = 250
too-many-lines-threshold = 100
too-many-arguments-threshold = 7
enum-variant-size-threshold = 128

# Valid identifiers in rustdoc without needing backticks
doc-valid-idents = [
    "AntiGravity",
    "CANFD",
    "EtherCAT",
    "FreeRTOS",
    "Halos",
    "Holoscan",
    "IEEE754",
    "Linux",
    "Miri",
    "MMIO",
    "NVIDIA",
    "Pixi",
    "QEMU",
    "RISCV",
    "RVA23",
    "Thor",
    "WCET",
]

# Disallow dangerous or uncontrolled methods on production code paths
disallowed-methods = [
    { path = "std::panic::catch_unwind", reason = "Production targets compile with panic=abort; catch_unwind is strictly prohibited by Google style" },
    { path = "core::option::Option::unwrap", reason = "Use pattern matching (if let Some / let else) or expect with invariant rationale instead of unwrap" },
    { path = "core::result::Result::unwrap", reason = "Propagate errors with ? or handle via pattern matching instead of unwrap" },
]
