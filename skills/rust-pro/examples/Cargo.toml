[package]
name = "rust-pro-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Canonical production Rust package baseline enforcing Google Rust Styleguide and safety-critical invariants"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
# Typed error enums for library modules (v2.0+)
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
# Fast, isolated test runner
criterion = { version = "0.6", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
non_ascii_idents = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Google Rust Styleguide: Zero Uncontrolled Panics
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Google Rust Styleguide: Code Organization & Clean Imports
wildcard_imports = "deny"
enum_glob_use = "deny"
clone_on_ref_ptr = "deny"
needless_pass_by_value = "warn"

# Numeric Safety & Cast Hardening
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"

# Documentation Invariants
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "deny"

# Standard Library Trait Consistency
should_implement_trait = "warn"
new_without_default = "warn"
len_without_is_empty = "warn"
borrowed_box = "warn"
ptr_arg = "warn"
wrong_self_convention = "warn"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"

[profile.release-rt]
inherits = "release"
opt-level = "s"
panic = "abort"
debug-assertions = false
overflow-checks = true
