# Production PEP 621 Configuration for Marimo Reactive Notebooks
# Managed via uv supporting Python 3.14+ and Python 3.15.

[project]
name = "mimir-marimo-analysis"
version = "0.1.0"
description = "High-performance reactive data analysis notebooks with Marimo, uv, and Python 3.14+"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Panoptic-Huginn", email = "engineering@panoptic-huginn.org" }
]
dependencies = [
    "marimo>=0.25.2",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "polars>=1.20.0",
    "plotly>=5.24.0",
    "altair>=5.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "nbformat>=5.10.0",
]

[tool.uv]
package = false

[tool.marimo.runtime]
auto_instantiate = true

[tool.marimo.formatting]
line_length = 88

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["."]
python_files = ["*.py"]
python_functions = ["test_*"]

[tool.ruff]
cache-dir = "../../../.ruff_cache"
line-length = 88
target-version = "py314"
