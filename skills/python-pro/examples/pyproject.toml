# Turnkey Modern Python Project Configuration (November 2026)
# Defaults to Python 3.15; lower to ">=3.14" / "py314" / "3.14" ONLY when required
# runtime dependencies lack Python 3.15 wheels.
# Style Authority: Tier 1 repo overrides (88 chars, double quotes, grouped symbol
# imports, PEP 649 native annotations banning __future__.annotations via TID251)
# -> Tier 2 Google Python Style Guide -> Tier 3 PEP 8 & 23-family Ruff rules.

[project]
name = "my-python-project"
version = "0.1.0"
description = "Modern Python 3.15 (3.14 floor) project template following Google Style overrides and November 2026 tooling."
readme = "README.md"
# Greenfield default is ">=3.15"; use ">=3.14" only when blocked by third-party 3.15 wheels.
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.3",
    "structlog>=26.1.0",
]

[project.urls]
Homepage = "https://github.com/example-org/my-python-project"
Repository = "https://github.com/example-org/my-python-project"
Issues = "https://github.com/example-org/my-python-project/issues"
Changelog = "https://github.com/example-org/my-python-project/blob/main/CHANGELOG.md"

[dependency-groups]
# PEP 735 dev/quality groups — never place non-published tooling in [project.optional-dependencies].
lint = [
    "ruff>=0.17.5",
    "rumdl>=0.3.4",
    # Add "marimo>=0.25.2" when authoring reactive notebooks under notebooks/.
]
typecheck = [
    "basedpyright>=1.40.2",
    "ty>=0.0.104",
]
test = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
]
security = [
    "actionlint-py>=1.7.12.25",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "zizmor>=1.32.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "security" },
    "prek>=0.5.10",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [".agents", ".git", ".venv", "build", "dist"]
line-length = 88
preview = true
# Match requires-python lower bound ("py314" if supporting 3.14).
target-version = "py315"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "DOC",
    "UP",
    "B",
    "SIM",
    "C4",
    "DTZ",
    "PT",
    "RUF",
    "PERF",
    "FURB",
    "S",
    "ANN",
    "ASYNC",
    "PTH",
    "TID",
    "TC",
    "PL",
]
# Ruff RUF201: use full rule names in ignore lists rather than raw codes.
ignore = [
    "line-too-long",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14+ natively defers annotations via PEP 649/749 (annotationlib); remove 'from __future__ import annotations'."

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["print"]
"tests/**" = ["assert", "no-self-use", "magic-value-comparison"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
# Keep include strictly to existing directories; missing paths trigger exit code 3.
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportImplicitOverride = true
reportMissingTypeStubs = "warning"
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
reportPrivateUsage = false

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--doctest-modules", "--cov=src", "--cov-branch"]
markers = [
    "unit: fast isolated tests with no external I/O or network access",
    "integration: cross-module and subsystem integration tests",
    "regression: tests guarding against fixed defects",
    "e2e: full workflow and CLI verification tests",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.deptry]
exclude = ["tests", "scripts", ".venv"]
extend_exclude = ["examples"]

