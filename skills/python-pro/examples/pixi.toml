# Canonical Pixi Workspace Manifest (November 2026 Polyglot / Native-Toolchain Template)
# Use Pixi ONLY when requiring multiple languages (C23, C++23, Rust, SPARK Ada),
# native system libraries (CUDA, LLVM, HDF5), conda-forge-only packages, or unified
# cross-ecosystem CLI task locking; use uv by default for pure Python/PyPI projects.

[workspace]
name = "polyglot-python-workspace"
version = "0.1.0"
description = "Polyglot Python 3.15 + C++23 nanobind workspace pinned via conda-forge."
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
requires-pixi = ">=0.84.2"

[dependencies]
python = ">=3.15,<3.16"
clang = ">=23.1.0,<24"
clangxx = ">=23.1.0,<24"
cmake = ">=4.5.0,<5"
ninja = ">=1.13.0"
nanobind = ">=3.1.0"
numpy = ">=2.5.0"
uv = ">=0.12.0"

[pypi-dependencies]
basedpyright = ">=1.40.2"
deptry = ">=0.25.1"
hypothesis = ">=6.170.15"
pip-audit = ">=2.10.1"
prek = ">=0.5.10"
pydantic = ">=2.14.3"
pytest = ">=9.2.0"
pytest-cov = ">=7.1.0"
pytest-randomly = ">=5.1.0"
ruff = ">=0.17.5"
structlog = ">=26.1.0"
ty = ">=0.0.104"

[tasks]
lint = "ruff check . && ruff format --check ."
typecheck = "basedpyright && ty check"
audit = "deptry . && pip-audit"
test = "pytest -v"
check = { depends-on = ["lint", "typecheck", "audit", "test"] }
