[project]
name = "mimir-agent-kit"
version = "1.0.0"
description = "Cross-platform Google Antigravity plugin bundling custom systems engineering skills, GitHub Flow lifecycle rules, and portable research MCP servers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "basedpyright>=1.40.2",
    "deptry>=0.25.1",
    "hypothesis>=6.170.15",
    "pip-audit>=2.10.1",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "rumdl>=0.3.4",
    "ty>=0.0.104",
    "types-pyyaml>=6.0.12.20260815",
    "zizmor>=1.32.0",
]

[tool.uv]
package = false

[tool.ruff]
exclude = [".agents", ".venv"]
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "DOC",
    "UP",
    "B",
    "SIM",
    "C4",
    "DTZ",
    "PT",
    "RUF",
    "PERF",
    "FURB",
    "S",
    "ANN",
    "ASYNC",
    "PTH",
    "TID",
    "TC",
    "PL",
]
ignore = ["line-too-long"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14+ natively defers annotations via PEP 649/749 (annotationlib); remove 'from __future__ import annotations'."

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"scripts/validate_agentic_settings.py" = ["module-import-not-at-top-of-file"]
"scripts/validation/*.py" = [
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
]
"skills/marimo-pro/examples/**" = [
    "ANN",
    "D",
    "DOC",
    "assert",
    "import-outside-top-level",
    "magic-value-comparison",
    "too-many-arguments",
    "too-many-locals",
    "useless-expression",
]
"tests/**" = [
    "assert",
    "import-outside-top-level",
    "magic-value-comparison",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "too-many-branches",
    "too-many-nested-blocks",
    "undocumented-public-function",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
include = ["scripts", "tests", "skills/python-pro/examples/pep723_script.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
# Dynamic yaml.safe_load() / json.loads() payloads resolve nested values as Unknown
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["scripts", "tests", "skills/python-pro/examples/pep723_script.py"]

[tool.pytest]
minversion = "9.0"
strict = true
addopts = ["-ra", "--strict-markers", "--strict-config", "--doctest-modules"]
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "integration: component and validator integration tests",
    "regression: targeted bugfix regression tests",
    "e2e: end-to-end repository and skill verification tests",
]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.deptry]
extend_exclude = ["skills", "tests"]

[tool.deptry.per_rule_ignores]
# pyyaml is invoked via `uv run` in dev/CI hooks rather than packaged as a wheel (package = false)
DEP004 = ["yaml"]

[tool.rumdl]
exclude = [".git", ".github", ".venv", "build", "dist", "node_modules", "skills"]
flavor = "gfm"
line-length = 9999
respect-gitignore = true
